<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroHangar – panel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--violet:#7A3E9D;--blue:#2E8FC4;--teal:#0FB3A6;--pink:#E84F8C;--ink:#2B2A33;--muted:#6b6676;--card:#fff;--line:#e7e2ee;--bg:#f4f1f8}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--violet),var(--blue) 55%,var(--teal));min-height:100vh}
header{color:#fff;padding:16px 20px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:20px;margin:0;flex:1}
header small{opacity:.85;font-weight:400}
.layout{display:flex;gap:18px;padding:0 20px 40px;align-items:flex-start;max-width:1400px;margin:auto}
nav#tabs{flex:0 0 230px;position:sticky;top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px;display:none}
nav#tabs .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.75);margin:12px 8px 4px}
nav#tabs .grp:first-child{margin-top:2px}
main{flex:1;min-width:0}
.tile{background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:112px;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:34px;font-weight:600;line-height:1.1}
.tile .l{font-size:14px;font-weight:500}
.tile .s{font-size:12px;color:var(--muted)}
.tile.accent{background:var(--pink);color:#fff}.tile.accent .s{color:rgba(255,255,255,.85)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:12px 0}
.sec{color:#fff;font-weight:600;margin:18px 0 0}
nav#tabs.shown{display:block}
@media (max-width:820px){.layout{flex-direction:column;padding:0 12px 30px;gap:8px}
  nav#tabs.shown{position:sticky;top:0;z-index:6;width:100%;flex:none;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px;background:rgba(80,40,110,.85);backdrop-filter:blur(6px)}
  nav#tabs .grp{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}.tile .n{font-size:28px}.tile{min-height:96px;padding:12px}
  header small{display:none}}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tab{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:10px;padding:9px 12px;background:transparent;color:#fff;font:inherit;cursor:pointer;text-align:left}
.tab:hover{background:rgba(255,255,255,.15)}
.tab.on{background:#fff;color:var(--violet);font-weight:600}
.tab .cnt{font-size:12px;background:rgba(255,255,255,.22);border-radius:999px;padding:0 8px}
.tab.on .cnt{background:var(--bg)}
.tab .cnt.alert{background:var(--pink);color:#fff}
@media (max-width:820px){.tab{width:auto;white-space:nowrap;flex:0 0 auto;gap:6px}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:90px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1 1 160px}
button{font:inherit;cursor:pointer;border-radius:8px;border:0;padding:8px 14px;background:var(--violet);color:#fff}
button.ghost{background:transparent;color:var(--violet);border:1px solid var(--line)}
button.danger{background:#c62828}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.item:hover{background:#faf7fd;cursor:pointer}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--pink);color:#fff;margin-right:4px}
.chip.g{background:#e8f6f4;color:#00594f}
.muted{color:var(--muted);font-size:13px}
.status{position:sticky;top:0;z-index:5;margin:0 0 8px;padding:10px 14px;border-radius:10px;background:#fff;display:none}
.status.ok{display:block;border-left:5px solid var(--teal)}
.status.err{display:block;border-left:5px solid #c62828}
dialog{border:0;border-radius:14px;max-width:820px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(30,10,40,.5)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.small td,.small th{padding:4px}
.tab small{opacity:.75}
table.contacts td{font-size:14px}
.ell{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowrap{white-space:nowrap}
.chip{white-space:nowrap}
.inl{flex-direction:row;align-items:center;gap:6px;flex:0 0 auto;font-size:13px;color:var(--ink)}
.bulk{margin:4px 0 10px}
button.pub{padding:3px 10px;font-size:12px;border-radius:999px}
button.pub.on{background:var(--teal)}
button.pub.off{background:#b9b3c4}
.small input{width:100%}
@media (max-width:600px){.hide-sm{display:none}}
.chip.p{background:linear-gradient(90deg,#7b3fa0,#e2457a);color:#fff}
fieldset.partner{border:1px solid var(--line);border-radius:12px;margin-top:12px;padding:10px 12px}
fieldset.partner legend{color:var(--pink);font-weight:600;padding:0 6px}
</style>
</head>
<body>
<header>
  <h1>AeroHangar – zarządzanie <small>· dane, które aplikacje pobierają przy każdym otwarciu</small></h1>
  <div id="who" class="row" style="color:#fff;display:none"></div>
</header>
<div class="layout">
<nav id="tabs"></nav>
<main>
  <div id="status" class="status"></div>

  <section class="card" id="login" style="max-width:420px;margin:30px auto">
    <h3 style="margin-top:0">Logowanie</h3>
    <form id="loginForm">
      <label>Login<input id="lg" autocomplete="username" required></label>
      <label style="margin-top:8px">Hasło<input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="row" style="margin-top:12px"><button>Zaloguj</button></div>
    </form>
  </section>
  <section id="view"></section>
</main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
/*AH_WP_CONFIG*/
const FILES = { bulletins: 1, contacts: 1, types: 1, news: 1, examiners: 1, sponsor: 1 };
const KINDS_B = ["AD", "ASB", "SB", "SIB", "DOC"];
const KINDS_C = { dealer: "Dealer", manufacturer: "Producent", rotax_service: "Serwis Rotax", rotax_distributor: "Dystrybutor Rotax", maintenance: "Organizacja obsługowa", mechanic: "Mechanik", instructor: "Instruktor", school: "Szkoła lotnicza", examiner: "Egzaminator", ame: "Lekarz orzecznik (AME)", aemc: "Centrum medycyny lotniczej (AeMC)" };
const LANGS = ["pl", "en", "sk", "fr"];
// Contact tabs: which kinds each shows, and which data file holds them (examiners are a separate on-demand file).
const CGROUPS = {
  c_service: { name: "Serwisy", kinds: ["rotax_service", "rotax_distributor", "maintenance"], file: "contacts", newKind: "maintenance" },
  c_maker: { name: "Producenci", kinds: ["manufacturer"], file: "contacts", newKind: "manufacturer" },
  c_dealer: { name: "Dealerzy", kinds: ["dealer"], file: "contacts", newKind: "dealer" },
  c_mech: { name: "Mechanicy", kinds: ["mechanic"], file: "contacts", newKind: "mechanic" },
  c_instr: { name: "Instruktorzy", kinds: ["instructor"], file: "contacts", newKind: "instructor" },
  c_school: { name: "Szkoły", kinds: ["school"], file: "contacts", newKind: "school" },
  c_exam: { name: "Egzaminatorzy", kinds: ["examiner"], file: "examiners", newKind: "examiner" },
  c_ame: { name: "Lekarze orzecznicy", kinds: ["ame"], file: "examiners", newKind: "ame" },
  c_aemc: { name: "Centra medyczne", kinds: ["aemc"], file: "contacts", newKind: "aemc" },
};
const fileOfKind = k => (k === "examiner" || k === "ame") ? "examiners" : "contacts";
const state = { tab: "home", data: {}, sha: {}, filter: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) { } }
function load(k) { try { return localStorage.getItem(k) } catch (e) { return null } }

function status(msg, ok = true) {
  const el = $("#status"); el.textContent = msg; el.className = "status " + (ok ? "ok" : "err");
  if (ok) setTimeout(() => { if (el.textContent === msg) el.className = "status" }, 6000);
}

// ---------------------------------------------------------------- server API
async function api(action, opts = {}) {
  const WP = window.AH_WP;
  const r = await fetch((WP ? WP.api + "?a=" : "api.php?a=") + action + (opts.q || ""), {
    method: opts.body ? "POST" : "GET", credentials: "same-origin",
    headers: WP ? { "Content-Type": "application/json", "X-WP-Nonce": state.csrf || WP.nonce } : { "Content-Type": "application/json", "X-CSRF": state.csrf || "" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && action !== "login") { showLogin(); throw new Error("401 zaloguj się ponownie") }
  if (!r.ok) throw new Error(r.status + " " + (j.error || r.statusText));
  return j;
}
async function readFile(key) {
  const j = await api("get", { q: "&f=" + key });
  state.sha[key] = j.rev;
  state.data[key] = j.data ?? (key === "news" ? { version: 0, updated: "", messages: [] } : key === "examiners" ? { version: 0, updated: "", contacts: [] } : key === "sponsor" ? { version: 0, updated: "", banners: [] } : null);
}
async function writeFile(key, message) {
  const d = state.data[key];
  if (key === "bulletins") { d.bulletins.sort((a, b) => b.date.localeCompare(a.date)); d.updated = d.bulletins[0]?.date || d.updated; d.version = (d.version || 0) + 1 }
  if (key === "contacts" || key === "news" || key === "examiners" || key === "sponsor") { d.updated = new Date().toISOString().slice(0, 10); d.version = (d.version || 0) + 1 }
  try {
    const j = await api("save", { body: { f: key, data: d, rev: state.sha[key], message } });
    state.sha[key] = j.rev;
    status("Zapisano: " + message + ". Aplikacje pobiorą zmianę przy następnym otwarciu (najpóźniej w ciągu doby).");
  } catch (e) {
    status("Błąd zapisu: " + e.message, false);
    await readFile(key).catch(() => { });
    throw e;
  }
}
function showLogin() { if (window.AH_WP) { location.href = window.AH_WP.login; return } $("#login").style.display = ""; $("#who").style.display = "none"; $("#view").innerHTML = ""; $("#tabs").innerHTML = ""; $("#tabs").classList.remove("shown") }
async function start() {
  const me = await api("me");
  if (!me.user) return showLogin();
  state.csrf = me.csrf; state.user = me.user; state.publicBase = me.publicBase;
  // Optional files (e.g. examiners on an older server) must not block the login.
  const missing = [];
  await Promise.all(Object.keys(FILES).map(f => readFile(f).catch(e => {
    if (f === "examiners" || f === "news" || f === "sponsor") { missing.push(f); state.data[f] = f === "news" ? { version: 0, updated: "", messages: [] } : f === "sponsor" ? { version: 0, updated: "", banners: [] } : { version: 0, updated: "", contacts: [] }; state.sha[f] = "" }
    else throw e;
  })));
  if (missing.includes("sponsor")) {
    status("Serwer nie obsługuje jeszcze partnerów i sponsora – podmień private/bootstrap.php i admin/api.php z nowej paczki.", false);
    state.noSponsor = true;
  }
  if (missing.includes("examiners")) {
    status("Serwer nie obsługuje jeszcze listy egzaminatorów – podmień plik private/bootstrap.php i admin/api.php z nowej paczki. Pozostałe dane działają.", false);
    state.noExaminers = true;
  }
  $("#login").style.display = "none";
  $("#who").style.display = "flex";
  $("#who").innerHTML = `<span>${esc(me.user.login)} (${esc(me.user.role)})</span><button class="ghost" style="color:#fff;border-color:rgba(255,255,255,.5);padding:5px 12px" id="logout">Wyloguj</button>`;
  $("#logout").onclick = async () => { if (me.wp) { location.href = me.logout; return } await api("logout", { body: {} }); location.reload() };
  if (me.wp) $("#logout").insertAdjacentHTML("beforebegin", `<a href="${esc(window.AH_WP.wpAdmin)}" style="color:#fff;margin-right:8px">← WordPress</a>`);
  if (location.hash.length > 1) state.tab = location.hash.slice(1);
  renderTabs(); render(); loadSubCount(); loadReqCount();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  try { const j = await api("login", { body: { login: $("#lg").value, password: $("#pw").value } }); state.csrf = j.csrf; $("#pw").value = ""; await start() }
  catch (err) { status("Logowanie nieudane: " + err.message, false) }
};

// ---------------------------------------------------------------- UI helpers
function renderTabs() {
  const count = g => (state.data[CGROUPS[g].file]?.contacts || []).filter(c => CGROUPS[g].kinds.includes(c.kind)).length;
  const groups = [
    ["", [["home", "Pulpit"]]],
    ["Dane w aplikacji", [["bulletins", "Biuletyny", state.data.bulletins?.bulletins?.length], ["types", "Typy samolotów", state.data.types?.length], ["news", "Komunikaty", state.data.news?.messages?.length]]],
    ["Kontakty", Object.keys(CGROUPS).filter(g => !(state.noExaminers && CGROUPS[g].file === "examiners")).map(g => [g, CGROUPS[g].name, count(g)])],
    ["Zarabianie", [["partners", "Partnerzy", partners().filter(isActive).length], ["requests", "Zapytania serwisowe", state.reqCount, state.reqCount > 0], ["sponsor", "Sponsor / baner", (state.data.sponsor?.banners || []).length]]],
    ["Użytkownicy aplikacji", [["subs", "Zgłoszenia", state.subCount, state.subCount > 0], ["stats", "Statystyki"], ["installs", "Instalacje i Pro"], ...(window.AH_WP ? [["accounts", "Konta pilotów"]] : [])]],
    ["System", [["history", "Historia i kopie"], ...(state.user?.role === "admin" ? [...(window.AH_WP ? [] : [["users", "Konta panelu"]]), ["settings", "Ustawienia"]] : [])]],
  ];
  const nav = $("#tabs");
  nav.classList.add("shown");
  nav.innerHTML = groups.map(([g, items]) => (g ? `<div class="grp">${g}</div>` : "") + items.map(([k, n, c, alert]) =>
    `<button class="tab ${state.tab === k ? "on" : ""}" data-tab="${k}"><span>${n}</span>${c != null ? `<span class="cnt ${alert ? "alert" : ""}">${c}</span>` : ""}</button>`).join("")).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.filter = ""; renderTabs(); render(); window.scrollTo(0, 0) });
  nav.querySelector(".tab.on")?.scrollIntoView({ block: "nearest", inline: "center" });
}

function field(name, label, value = "", type = "text", extra = "") {
  return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
}
function select(name, label, options, value) {
  return `<label>${label}<select name="${name}">${options.map(([v, n]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>`;
}
function openDialog(html, onSave, onDelete) {
  const f = $("#dlgForm");
  f.innerHTML = html + `<div class="row" style="margin-top:14px;justify-content:flex-end">
    ${onDelete ? '<button type="button" class="danger" id="dDel">Usuń</button><span style="flex:1"></span>' : ""}
    <button type="button" class="ghost" id="dCancel">Anuluj</button><button type="button" id="dSave">Zapisz w repozytorium</button></div>`;
  $("#dCancel").onclick = () => $("#dlg").close();
  $("#dSave").onclick = async () => {
    const btn = $("#dSave"); btn.disabled = true;
    try { await onSave(new FormData(f)); $("#dlg").close(); render() } catch (e) { if (!(e instanceof Error) || !String(e.message).match(/^\d{3}/)) status(String(e.message || e), false) } finally { btn.disabled = false }
  };
  if (onDelete) $("#dDel").onclick = async () => { if (confirm("Usunąć ten wpis?")) { try { await onDelete(); $("#dlg").close(); render() } catch (e) { } } };
  $("#dlg").showModal();
}
const allGroups = () => [...new Set(state.data.types.flatMap(t => t.bulletinGroups))].sort();
const searchBox = ph => `<div class="row" style="margin-bottom:8px"><input id="q" placeholder="${ph}" value="${esc(state.filter)}" style="flex:1"><button id="add">+ Dodaj</button></div>`;
function hookSearch(addFn) {
  $("#q").oninput = e => { state.filter = e.target.value; render(true) };
  $("#add").onclick = addFn;
}

// ---------------------------------------------------------------- bulletins
function renderBulletins() {
  const list = state.data.bulletins.bulletins.filter(b => !state.filter || (b.id + " " + b.title + " " + b.groups.join(" ")).toLowerCase().includes(state.filter.toLowerCase()));
  return `<div class="card">${searchBox("Szukaj numeru, tytułu, grupy…")}
    <p class="muted">Grupa decyduje, którzy właściciele zobaczą biuletyn. <b>ROTAX_912</b> = wszystkie samoloty z Rotaxem 912. Nowe dokumenty TOMARK dopisuje automat (cron).</p>
    <table><tr><th>Data</th><th>Numer</th><th>Tytuł</th><th class="hide-sm">Grupy</th></tr>
    ${list.map(b => `<tr class="item" data-id="${esc(b.id)}"><td>${esc(b.date)}</td><td><span class="chip">${esc(b.kind)}</span>${b.mandatory ? '<span class="chip" style="background:#0B2545">obow.</span>' : ""}<br>${esc(b.id)}</td><td>${esc(b.title)}</td><td class="hide-sm">${b.groups.map(g => `<span class="chip g">${esc(g)}</span>`).join("")}</td></tr>`).join("")}
    </table></div>`;
}
function editBulletin(b) {
  const isNew = !b; b = b || { id: "", date: new Date().toISOString().slice(0, 10), title: "", groups: [], kind: "SB", mandatory: null, url: "" };
  openDialog(`<h3>${isNew ? "Nowy biuletyn" : "Biuletyn " + esc(b.id)}</h3>
    <div class="grid2">${field("id", "Numer (unikalny)", b.id, "text", isNew ? "required" : "readonly")}${field("date", "Data", b.date, "date")}
    ${select("kind", "Rodzaj", KINDS_B.map(k => [k, k]), b.kind)}
    ${select("mandatory", "Obowiązkowy", [["null", "Sprawdź dokument"], ["true", "Tak"], ["false", "Nie / informacyjny"]], String(b.mandatory))}</div>
    <label>Tytuł<textarea name="title">${esc(b.title)}</textarea></label>
    ${field("url", "Link do źródła", b.url || "", "url")}
    <p class="muted">Grupy (komu pokazać):</p>
    <div class="row">${allGroups().map(g => `<label style="flex:0 0 auto;flex-direction:row;align-items:center"><input type="checkbox" name="g_${g}" ${b.groups.includes(g) ? "checked" : ""}> ${g}</label>`).join("")}</div>`,
    async fd => {
      const groups = allGroups().filter(g => fd.get("g_" + g));
      const id = fd.get("id").trim();
      if (!id || !fd.get("title").trim() || !groups.length) throw new Error("Uzupełnij numer, tytuł i co najmniej jedną grupę.");
      if (isNew && state.data.bulletins.bulletins.some(x => x.id === id)) throw new Error("Taki numer już istnieje.");
      const m = fd.get("mandatory");
      const nb = { id, date: fd.get("date"), title: fd.get("title").trim(), groups, kind: fd.get("kind"), mandatory: m === "null" ? null : m === "true", url: fd.get("url").trim() || null };
      const list = state.data.bulletins.bulletins;
      const i = list.findIndex(x => x.id === id);
      if (i >= 0) list[i] = nb; else list.push(nb);
      await writeFile("bulletins", (isNew ? "Add bulletin " : "Edit bulletin ") + id);
    },
    isNew ? null : async () => {
      state.data.bulletins.bulletins = state.data.bulletins.bulletins.filter(x => x.id !== b.id);
      await writeFile("bulletins", "Delete bulletin " + b.id);
    });
}

// ---------------------------------------------------------------- contacts (one tab per group)
function groupList(g) {
  const G = CGROUPS[g];
  const q = state.filter.toLowerCase();
  return (state.data[G.file]?.contacts || []).filter(c => G.kinds.includes(c.kind))
    .filter(c => !q || [c.name, c.city, c.country, c.address, c.note, (c.brands || []).join(" ")].join(" ").toLowerCase().includes(q))
    .sort((a, b) => ((a.country || "PL") !== "PL") - ((b.country || "PL") !== "PL") || (a.country || "").localeCompare(b.country || "") || (a.city || "").localeCompare(b.city || "", "pl") || a.name.localeCompare(b.name, "pl"));
}
function renderContacts(g) {
  const G = CGROUPS[g];
  const list = groupList(g);
  const auto = c => /^ulc-/.test(c.id) ? '<span class="chip g" title="Odświeżane automatycznie z listy ULC">ULC</span>' : "";
  const hint = {
    c_service: "Serwisy Rotax, dystrybutorzy i organizacje obsługowe (Part-CAO / Part-145 z listy ULC – odświeżane co tydzień).",
    c_exam: "Listy ULC (samoloty, UL, mechanicy) – odświeżane co tydzień. Aplikacja pobiera je tylko na żądanie użytkownika. Ręcznie dodani egzaminatorzy zostają.",
    c_ame: "Lista lekarzy orzeczników ULC (klasa 1, 2, 3, LAPL) – odświeżana co tydzień, pobierana w aplikacji razem z egzaminatorami (na żądanie).",
    c_aemc: "Centra medycyny lotniczej z listy ULC – odświeżane co tydzień.",

async function setPublish(file, ids, on, label) {

  state.data[file].contacts.forEach(c => { if (set.has(c.id)) { if (on) delete c.publish; else c.publish = false } });
  await writeFile(file, `${on ? "Publish" : "Hide"} ${ids.length} ${label}`);
  render();
}
function hookContactTools(g) {
  const G = CGROUPS[g], v = $("#view");
  v.querySelectorAll("button[data-pub]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = state.data[G.file].contacts.find(x => x.id === b.dataset.pub);
    setPublish(G.file, [c.id], c.publish === false, c.name).catch(() => { });
  });
  v.querySelectorAll(".nosel").forEach(td => td.onclick = e => e.stopPropagation());
  $("#selAll").onchange = e => v.querySelectorAll("input.sel").forEach(x => x.checked = e.target.checked);
  v.querySelectorAll("button[data-bulk]").forEach(b => b.onclick = () => {
    const ids = [...v.querySelectorAll("input.sel:checked")].map(x => x.value);
    if (!ids.length) return status("Zaznacz wpisy w pierwszej kolumnie.", false);
    setPublish(G.file, ids, b.dataset.bulk === "pub", G.name.toLowerCase()).catch(() => { });
  });
  const pn = $("#pubNew");
  if (pn) pn.onchange = async () => { state.data[G.file].publishNew = pn.checked; await writeFile(G.file, "Default for new ULC entries: " + (pn.checked ? "public" : "hidden")).catch(() => { }) };
  const pg = $("#pullGh");
  if (pg) pg.onclick = async () => {
    pg.disabled = true; pg.textContent = "Pobieranie…";
    try {
      const r = await api("pull_github", { body: {} });
      await Promise.all(["examiners", "contacts", "bulletins"].map(readFile));
      const fmt = x => x?.error ? "błąd" : `${x?.imported ?? x?.total ?? 0}${x?.new != null ? ` (nowe: ${x.new})` : ""}`;
      status(`Pobrano z GitHuba – egzaminatorzy: ${fmt(r.examiners)}, organizacje: ${fmt(r.contacts)}, biuletyny – nowe: ${r.bulletins?.new ?? "błąd"}.`);
      renderTabs(); render();
    } catch (e) { status(e.message, false); pg.disabled = false }
  };
}

function directImageUrl(u) {
  u = (u || "").trim();
  const m = u.match(/(?:drive|docs)\.google\.com\/.*?(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{10,})/);
  if (m) return "https://lh3.googleusercontent.com/d/" + m[1];
  if (/dropbox\.com/.test(u)) return u.replace("dl=0", "raw=1");
  return u;
}
function hookBannerPreview() {
  const inp = document.querySelector('#dlgForm input[name=image]'), img = $("#bnPrev");
  if (!inp || !img) return;
  const show = () => { const u = directImageUrl(inp.value); if (/^https:\/\//.test(u)) { img.src = u; img.style.display = "" } else img.style.display = "none" };
  img.onerror = () => { img.style.display = "none"; $("#bnHint").innerHTML = '<b style="color:var(--pink)">Nie da się wczytać obrazka.</b> Sprawdź, czy plik na Dysku jest udostępniony „Każda osoba mająca link”.' };
  inp.oninput = show; show();
}

      <td class="hide-sm nowrap">${d(a.lastSeen)}<div class="muted">${d(a.lastSync)}</div></td><td>${a.aircraft}</td>
      <td class="nowrap">${admin ? `<button class="ghost" data-edit="${a.id}">Edytuj</button>` : ""}</td></tr>`).join("") || '<tr><td class="muted">Brak kont.</td></tr>'}</table></div>`;
  $("#q").oninput = e => { state.filter = e.target.value; clearTimeout(state._qt); state._qt = setTimeout(() => renderAccounts().then(() => { const x = $("#q"); x.focus(); x.setSelectionRange(x.value.length, x.value.length) }), 350) };
  v.querySelectorAll("button[data-edit]").forEach(b => b.onclick = () => editAccount(state.accounts.find(a => a.id === +b.dataset.edit)));
}
function editAccount(a) {
  const isAdminUser = a.panelRole === "admin";
  openDialog(`<h3>${esc(a.name)} <span class="muted" style="font-size:14px">${esc(a.email)}</span></h3>
    <label class="inl"><input type="checkbox" name="blocked" ${a.blocked ? "checked" : ""}> zablokuj dostęp aplikacji (klucz przestaje działać w AeroHangar)</label>
    <div class="grid2">
      ${select("plan", "Plan", [["", "—"], ["pilot", "Pilot / właściciel"], ["mechanic", "Mechanik"], ["school", "Szkoła lotnicza"], ["dealer", "Dealer"], ["service", "Serwis"], ["club", "Aeroklub (stary plan)"]], a.plan)}
      ${field("maxAircraft", "Limit samolotów (puste = z produktu, inaczej 1 za darmo / bez limitu z Pro)", a.maxAircraft, "number", 'min="0" max="999"')}
      ${field("maxTypes", "Limit własnych typów samolotów (puste = z produktu, inaczej bez limitu)", a.maxTypes, "number", 'min="0" max="999"')}
    </div>
    <label class="inl"><input type="checkbox" name="pro" ${a.pro ? "checked" : ""}> Pro przyznane ręcznie</label>
    <div class="grid2">${field("proUntil", "Pro ręczne do (puste = bez limitu)", a.proUntil, "date")}
      ${isAdminUser ? '<p class="muted">Administrator WordPressa – pełny dostęp do panelu.</p>' : select("panelRole", "Dostęp do panelu AeroHangar", [["", "brak"], ["viewer", "podgląd"], ["editor", "edycja danych (biuletyny, kontakty…)"]], a.panelRole)}</div>
    ${field("note", "Notatka (widoczna tylko tutaj)", a.note)}
    ${a.access ? `<p class="muted">Dostęp z zakupu WooCommerce: ${esc(PLAN[a.access.plan] || a.access.plan)} ${a.access.until ? "do " + new Date(a.access.until * 1000).toISOString().slice(0, 10) : "bez limitu"} – liczy się niezależnie od ustawień powyżej (blokada go wyłącza).</p>` : ""}
    ${a.key ? `<p><button type="button" class="ghost" id="unlinkKey">Unieważnij klucz (…${esc(a.keyHint)})</button></p>` : '<p class="muted">Konto nie ma jeszcze klucza aplikacji.</p>'}`,
    async fd => {
      const data = { blocked: !!fd.get("blocked"), pro: !!fd.get("pro"), proUntil: fd.get("proUntil") || "", plan: fd.get("plan") || "",
        maxAircraft: fd.get("maxAircraft") === "" ? "" : +fd.get("maxAircraft"), maxTypes: fd.get("maxTypes") === "" ? "" : +fd.get("maxTypes"), panelRole: fd.get("panelRole") || (isAdminUser ? "admin" : ""), note: (fd.get("note") || "").trim() };
      await api("accounts", { body: { user: a.id, action: "save", data } });
      status("Zapisano uprawnienia konta " + a.login + ".");
      renderAccounts();
    });
  const u = $("#unlinkKey");
  if (u) u.onclick = async () => { if (!confirm("Unieważnić klucz? Aplikacje tego konta stracą połączenie.")) return; await api("accounts", { body: { user: a.id, action: "unlink" } }); $("#dlg").close(); status("Klucz unieważniony."); renderAccounts() };
}

// ---------------------------------------------------------------- installations: manual Pro, reset
async function renderInstalls() {
  const v = $("#view");
  const j = await api("installs");
  const admin = state.user?.role === "admin";
  const q = (state.filter || "").trim().toUpperCase();
  const list = j.installs.filter(i => !q || i.code.includes(q) || (i.note || "").toUpperCase().includes(q) || (i.types || []).join(" ").toUpperCase().includes(q));
  v.innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px"><input id="q" placeholder="Kod instalacji (8 znaków z „O aplikacji”), notatka lub typ samolotu…" value="${esc(state.filter)}" style="flex:1">
      ${admin ? '<button class="danger" id="resetInst">Resetuj licznik instalacji</button>' : ""}</div>
    <p class="muted">Użytkownik widzi swój <b>kod instalacji</b> w aplikacji: „O aplikacji” → AeroHangar Pro. Wpisz go tutaj i włącz <b>Pro ręcznie</b> (np. dla testerów, partnerów, instruktorów). Aplikacja odczyta to przy następnym otwarciu albo po „Przywróć zakup”. Pro ręczne jest bezpłatnym przydziałem – w wersji z Google Play nie sprzedawaj go poza sklepem.</p>
    <p class="muted">Wszystkich: <b>${j.installs.length}</b> · Pro z Google Play: <b>${j.installs.filter(i => i.pro).length}</b> · Pro ręczne: <b>${j.installs.filter(i => i.proGranted).length}</b>. Pokazano ${Math.min(list.length, 300)} z ${list.length}.</p>
    <table><tr><th>Kod</th><th>Ostatnio</th><th class="hide-sm">Pierwsza</th><th class="hide-sm">Wersja</th><th>Samoloty</th><th>Pro</th><th class="hide-sm">Notatka</th></tr>
    ${list.slice(0, 300).map(i => `<tr><td class="nowrap"><b style="font-family:monospace">${esc(i.code)}</b></td><td class="nowrap">${esc(i.last || "")}</td><td class="hide-sm nowrap">${esc(i.first || "")}</td>
      <td class="hide-sm">${esc(i.v || "")} <span class="muted">${esc(i.lang || "")}</span></td><td>${i.ac ?? "?"}<div class="muted ell">${esc((i.types || []).join(", "))}</div></td>
      <td class="nowrap">${i.pro ? '<span class="chip p">Google Play</span> ' : ""}${admin ? `<button class="pub ${i.proGranted ? "on" : "off"}" data-grant="${esc(i.id)}" data-on="${i.proGranted ? 0 : 1}">${i.proGranted ? "ręczne: tak" : "ręczne: nie"}</button>` : (i.proGranted ? "ręczne" : "")}</td>
      <td class="hide-sm">${admin ? `<input data-note="${esc(i.id)}" value="${esc(i.note || "")}" placeholder="np. Jan K., tester" style="min-width:140px">` : esc(i.note || "")}</td></tr>`).join("") || '<tr><td class="muted">Brak instalacji.</td></tr>'}</table></div>`;
  $("#q").oninput = e => { state.filter = e.target.value; clearTimeout(state._qt); state._qt = setTimeout(() => renderInstalls().then(() => { const x = $("#q"); x.focus(); x.setSelectionRange(x.value.length, x.value.length) }), 250) };
  v.querySelectorAll("button[data-grant]").forEach(b => b.onclick = async () => {
    try { await api("installs", { body: { action: "grant", id: b.dataset.grant, on: b.dataset.on === "1" } }); status(b.dataset.on === "1" ? "Włączono Pro dla tej instalacji." : "Wyłączono ręczne Pro."); renderInstalls() } catch (e) { status(e.message, false) }
  });
  v.querySelectorAll("input[data-note]").forEach(inp => inp.onchange = async () => {
    try { await api("installs", { body: { action: "note", id: inp.dataset.note, note: inp.value } }); status("Zapisano notatkę.") } catch (e) { status(e.message, false) }
  });
  const r = $("#resetInst");
  if (r) r.onclick = async () => {
    if (!confirm("Wyzerować licznik instalacji? Instalacje z ręcznie przyznanym Pro zostaną. Kopia poprzedniej listy zostaje w private/state.")) return;
    try { await api("installs", { body: { action: "reset" } }); status("Licznik instalacji wyzerowany."); renderInstalls() } catch (e) { status(e.message, false) }
  };
}

// ---------------------------------------------------------------- dashboard
async function renderHome() {
  const v = $("#view");
  const st = await api("stats").catch(() => null);
  const contacts = state.data.contacts?.contacts || [], exams = state.data.examiners?.contacts || [];
  const pub = l => l.filter(c => c.publish !== false).length;
  const b = state.data.bulletins?.bulletins || [];
  const since = new Date(Date.now() - 30 * 86400e3).toISOString().slice(0, 10);
  const tile = (go, n, l, s2, cls = "") => `<div class="tile ${cls}" data-go="${go}"><span class="n">${n}</span><span class="l">${l}</span><span class="s">${s2}</span></div>`;
  const cnt = g => (state.data[CGROUPS[g].file]?.contacts || []).filter(c => CGROUPS[g].kinds.includes(c.kind));
  v.innerHTML = `
    <div class="sec">Aplikacja</div>
    <div class="tiles">
      ${tile("stats", st ? st.total : "–", "Instalacje", st ? `aktywne: ${st.active30} w 30 dni, ${st.active7} w 7 dni` : "brak danych")}
      ${tile("stats", st ? Object.values(st.newPerMonth || {}).slice(-1)[0] || 0 : "–", "Nowe w tym miesiącu", st ? `wersje: ${Object.keys(st.versions || {}).slice(0, 3).join(", ") || "–"}` : "")}
      ${tile("subs", state.subCount ?? 0, "Zgłoszenia do zatwierdzenia", state.subCount ? "kliknij, aby przejrzeć" : "brak nowych", state.subCount ? "accent" : "")}
      ${tile("news", (state.data.news?.messages || []).length, "Komunikaty", "na karcie głównej aplikacji")}
    </div>
    ${state.noSponsor ? "" : `<div class="sec">Zarabianie</div>
    <div class="tiles">
      ${tile("partners", partners().filter(isActive).length, "Aktywni partnerzy", (() => { const s = partners().filter(c => isActive(c) && daysLeft(c) <= 30).length; return s ? `kończy się w 30 dni: ${s}` : "wyróżnione wpisy w aplikacji" })(), partners().some(c => isActive(c) && daysLeft(c) <= 30) ? "accent" : "")}
      ${tile("requests", state.reqCount ?? 0, "Nowe zapytania serwisowe", "„Umów przegląd” z aplikacji", state.reqCount ? "accent" : "")}
      ${tile("sponsor", (state.data.sponsor?.banners || []).filter(bannerLive).length, "Banery sponsora", "aktywne teraz w aplikacji")}
      ${tile("stats", st ? (st.pro ?? 0) : "–", "Użytkownicy Pro", "zakup w aplikacji (więcej niż 1 samolot)")}
    </div>`}
    <div class="sec">Dane</div>
    <div class="tiles">
      ${tile("bulletins", b.length, "Biuletyny", `nowe w 30 dni: ${b.filter(x => x.date >= since).length} · obowiązkowe: ${b.filter(x => x.mandatory === true).length}`)}
      ${tile("types", (state.data.types || []).length, "Typy samolotów", `producentów: ${new Set((state.data.types || []).map(t => t.manufacturer)).size}`)}
    </div>
    <div class="sec">Kontakty</div>
    <div class="tiles">
      ${Object.keys(CGROUPS).filter(g => !(state.noExaminers && CGROUPS[g].file === "examiners")).map(g => { const l = cnt(g); return tile(g, l.length, CGROUPS[g].name, `w aplikacji: ${pub(l)}${l.length - pub(l) ? ` · ukryte: ${l.length - pub(l)}` : ""}`) }).join("")}
    </div>
    <div class="card"><div class="row"><b style="flex:1">Aktualizacja danych z GitHuba</b><button id="pullHome">Pobierz teraz listy ULC, producentów, biuletyny i typy</button></div>
    <p class="muted" style="margin-bottom:0">Dodaje tylko brakujące wpisy – Twoich zmian i usuniętych wpisów nie przywraca. Listy ULC podmienia, zachowując Twoje ustawienia publikacji.</p></div>`;
  v.querySelectorAll(".tile[data-go]").forEach(t => t.onclick = () => { state.tab = t.dataset.go; renderTabs(); render() });
  $("#pullHome").onclick = async () => {
    const btn = $("#pullHome"); btn.disabled = true; btn.textContent = "Pobieranie…";
    try {
      const r = await api("pull_github", { body: {} });
      await Promise.all(["examiners", "contacts", "bulletins", "types"].map(readFile));
      status(`Pobrano – kontakty: +${(r.contacts?.added_other || 0) + (r.contacts?.new || 0)}, egzaminatorzy: +${(r.examiners?.added_other || 0) + (r.examiners?.new || 0)}, biuletyny: +${r.bulletins?.new ?? 0}, typy: +${r.types?.new ?? 0}${r.types?.upgraded ? ` (zaktualizowane ${r.types.upgraded})` : ""}.` + (r.contacts?.error || r.bulletins?.error ? " Część plików nie została pobrana – sprawdź połączenie serwera z internetem." : ""));
      renderTabs(); renderHome();
    } catch (e) { status(e.message, false); btn.disabled = false }
  };
}

// ---------------------------------------------------------------- render
function render(keepFocus) {
  if (!state.data.types) return;
  const v = $("#view");
  const sel = keepFocus ? $("#q")?.selectionStart : null;
  if (state.tab === "bulletins") { v.innerHTML = renderBulletins(); hookSearch(() => editBulletin(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editBulletin(state.data.bulletins.bulletins.find(b => b.id === r.dataset.id))) }
  if (CGROUPS[state.tab]) {
    const g = state.tab, file = CGROUPS[g].file;
    v.innerHTML = renderContacts(g); hookSearch(() => editContact(null, g));
    v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editContact(state.data[file].contacts.find(c => c.id === r.dataset.id), g));
    hookContactTools(g);
  }
  if (state.tab === "home") { renderHome().catch(e => status(e.message, false)); return }
  if (state.tab === "subs") { renderSubs().catch(e => status(e.message, false)); return }
  if (state.tab === "partners") { renderPartners().catch(e => status(e.message, false)); return }
  if (state.tab === "requests") { renderRequests().catch(e => status(e.message, false)); return }
  if (state.tab === "sponsor") { renderSponsor().catch(e => status(e.message, false)); return }
  if (state.tab === "settings") { renderSettings().catch(e => status(e.message, false)); return }
  if (state.tab === "stats") { renderStats().catch(e => status(e.message, false)); return }
  if (state.tab === "installs") { renderInstalls().catch(e => status(e.message, false)); return }
  if (state.tab === "accounts") { renderAccounts().catch(e => status(e.message, false)); return }
  if (state.tab === "news") { v.innerHTML = renderNews(); hookSearch(() => editNews(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editNews(state.data.news.messages.find(n => n.id === r.dataset.id))) }
  if (state.tab === "history") { renderHistory().catch(e => status(e.message, false)); return }
  if (state.tab === "users") { renderUsers().catch(e => status(e.message, false)); return }
  if (state.tab === "types") { v.innerHTML = renderTypes(); hookSearch(() => editType(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editType(state.data.types.find(t => t.id === r.dataset.id))) }
  if (keepFocus) { const q = $("#q"); q.focus(); q.setSelectionRange(sel, sel) }
}

start().catch(e => status("Serwer: " + e.message, false));
</script>
</body>
</html>
