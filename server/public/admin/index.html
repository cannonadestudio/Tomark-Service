<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroHangar – panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--violet:#7A3E9D;--blue:#2E8FC4;--teal:#0FB3A6;--pink:#E84F8C;--ink:#2B2A33;--muted:#6b6676;--card:#fff;--line:#e7e2ee;--bg:#f4f1f8}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--violet),var(--blue) 55%,var(--teal));min-height:100vh}
header{color:#fff;padding:20px 16px 8px;max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:22px;margin:0;flex:1}
header small{opacity:.85}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.2);color:#fff;font:inherit;cursor:pointer}
.tab.on{background:var(--pink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:90px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1 1 160px}
button{font:inherit;cursor:pointer;border-radius:8px;border:0;padding:8px 14px;background:var(--violet);color:#fff}
button.ghost{background:transparent;color:var(--violet);border:1px solid var(--line)}
button.danger{background:#c62828}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.item:hover{background:#faf7fd;cursor:pointer}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--pink);color:#fff;margin-right:4px}
.chip.g{background:#e8f6f4;color:#00594f}
.muted{color:var(--muted);font-size:13px}
.status{position:sticky;top:0;z-index:5;margin:0 0 8px;padding:10px 14px;border-radius:10px;background:#fff;display:none}
.status.ok{display:block;border-left:5px solid var(--teal)}
.status.err{display:block;border-left:5px solid #c62828}
dialog{border:0;border-radius:14px;max-width:820px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(30,10,40,.5)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.small td,.small th{padding:4px}
.tab small{opacity:.75}
table.contacts td{font-size:14px}
.ell{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowrap{white-space:nowrap}
.chip{white-space:nowrap}
.small input{width:100%}
@media (max-width:600px){.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1>AeroHangar – zarządzanie<br><small>Dane, które aplikacje pobierają przy każdym otwarciu</small></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="status" class="status"></div>

  <section class="card" id="login" style="max-width:420px;margin:30px auto">
    <h3 style="margin-top:0">Logowanie</h3>
    <form id="loginForm">
      <label>Login<input id="lg" autocomplete="username" required></label>
      <label style="margin-top:8px">Hasło<input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="row" style="margin-top:12px"><button>Zaloguj</button></div>
    </form>
  </section>
  <div id="who" class="row" style="color:#fff;display:none;justify-content:flex-end;margin:4px 0"></div>
  <section id="view"></section>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
const FILES = { bulletins: 1, contacts: 1, types: 1, news: 1, examiners: 1 };
const KINDS_B = ["AD", "ASB", "SB", "SIB", "DOC"];
const KINDS_C = { dealer: "Dealer", manufacturer: "Producent", rotax_service: "Serwis Rotax", rotax_distributor: "Dystrybutor Rotax", maintenance: "Organizacja obsługowa", mechanic: "Mechanik", instructor: "Instruktor", examiner: "Egzaminator" };
const LANGS = ["pl", "en", "sk", "fr"];
// Contact tabs: which kinds each shows, and which data file holds them (examiners are a separate on-demand file).
const CGROUPS = {
  c_service: { name: "Serwisy", kinds: ["rotax_service", "rotax_distributor", "maintenance"], file: "contacts", newKind: "maintenance" },
  c_maker: { name: "Producenci", kinds: ["manufacturer"], file: "contacts", newKind: "manufacturer" },
  c_dealer: { name: "Dealerzy", kinds: ["dealer"], file: "contacts", newKind: "dealer" },
  c_mech: { name: "Mechanicy", kinds: ["mechanic"], file: "contacts", newKind: "mechanic" },
  c_instr: { name: "Instruktorzy", kinds: ["instructor"], file: "contacts", newKind: "instructor" },
  c_exam: { name: "Egzaminatorzy", kinds: ["examiner"], file: "examiners", newKind: "examiner" },
};
const fileOfKind = k => k === "examiner" ? "examiners" : "contacts";
const state = { tab: "bulletins", data: {}, sha: {}, filter: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) { } }
function load(k) { try { return localStorage.getItem(k) } catch (e) { return null } }

function status(msg, ok = true) {
  const el = $("#status"); el.textContent = msg; el.className = "status " + (ok ? "ok" : "err");
  if (ok) setTimeout(() => { if (el.textContent === msg) el.className = "status" }, 6000);
}

// ---------------------------------------------------------------- server API
async function api(action, opts = {}) {
  const r = await fetch("api.php?a=" + action + (opts.q || ""), {
    method: opts.body ? "POST" : "GET", credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-CSRF": state.csrf || "" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && action !== "login") { showLogin(); throw new Error("401 zaloguj się ponownie") }
  if (!r.ok) throw new Error(r.status + " " + (j.error || r.statusText));
  return j;
}
async function readFile(key) {
  const j = await api("get", { q: "&f=" + key });
  state.sha[key] = j.rev;
  state.data[key] = j.data ?? (key === "news" ? { version: 0, updated: "", messages: [] } : key === "examiners" ? { version: 0, updated: "", contacts: [] } : null);
}
async function writeFile(key, message) {
  const d = state.data[key];
  if (key === "bulletins") { d.bulletins.sort((a, b) => b.date.localeCompare(a.date)); d.updated = d.bulletins[0]?.date || d.updated; d.version = (d.version || 0) + 1 }
  if (key === "contacts" || key === "news" || key === "examiners") { d.updated = new Date().toISOString().slice(0, 10); d.version = (d.version || 0) + 1 }
  try {
    const j = await api("save", { body: { f: key, data: d, rev: state.sha[key], message } });
    state.sha[key] = j.rev;
    status("Zapisano: " + message + ". Aplikacje pobiorą zmianę przy następnym otwarciu (najpóźniej w ciągu doby).");
  } catch (e) {
    status("Błąd zapisu: " + e.message, false);
    await readFile(key).catch(() => { });
    throw e;
  }
}
function showLogin() { $("#login").style.display = ""; $("#who").style.display = "none"; $("#view").innerHTML = ""; $("#tabs").innerHTML = "" }
async function start() {
  const me = await api("me");
  if (!me.user) return showLogin();
  state.csrf = me.csrf; state.user = me.user; state.publicBase = me.publicBase;
  // Optional files (e.g. examiners on an older server) must not block the login.
  const missing = [];
  await Promise.all(Object.keys(FILES).map(f => readFile(f).catch(e => {
    if (f === "examiners" || f === "news") { missing.push(f); state.data[f] = f === "news" ? { version: 0, updated: "", messages: [] } : { version: 0, updated: "", contacts: [] }; state.sha[f] = "" }
    else throw e;
  })));
  if (missing.includes("examiners")) {
    status("Serwer nie obsługuje jeszcze listy egzaminatorów – podmień plik private/bootstrap.php i admin/api.php z nowej paczki. Pozostałe dane działają.", false);
    state.noExaminers = true;
  }
  $("#login").style.display = "none";
  $("#who").style.display = "flex";
  $("#who").innerHTML = `<span>${esc(me.user.login)} (${esc(me.user.role)})</span><button class="ghost" style="color:#fff;border-color:rgba(255,255,255,.5)" id="logout">Wyloguj</button>`;
  $("#logout").onclick = async () => { await api("logout", { body: {} }); location.reload() };
  renderTabs(); render();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  try { const j = await api("login", { body: { login: $("#lg").value, password: $("#pw").value } }); state.csrf = j.csrf; $("#pw").value = ""; await start() }
  catch (err) { status("Logowanie nieudane: " + err.message, false) }
};

// ---------------------------------------------------------------- UI helpers
function renderTabs() {
  const count = g => (state.data[CGROUPS[g].file]?.contacts || []).filter(c => CGROUPS[g].kinds.includes(c.kind)).length;
  const tabs = [["bulletins", "Biuletyny"], ...Object.keys(CGROUPS).filter(g => !(state.noExaminers && CGROUPS[g].file === "examiners")).map(g => [g, `${CGROUPS[g].name} <small>(${count(g)})</small>`]), ["types", "Typy samolotów"], ["news", "Komunikaty"], ["history", "Historia"]];
  if (state.user?.role === "admin") tabs.push(["users", "Użytkownicy"]);
  $("#tabs").innerHTML = tabs.map(([k, n]) => `<button class="tab ${state.tab === k ? "on" : ""}" data-tab="${k}">${n}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.filter = ""; renderTabs(); render() });
}

function field(name, label, value = "", type = "text", extra = "") {
  return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
}
function select(name, label, options, value) {
  return `<label>${label}<select name="${name}">${options.map(([v, n]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>`;
}
function openDialog(html, onSave, onDelete) {
  const f = $("#dlgForm");
  f.innerHTML = html + `<div class="row" style="margin-top:14px;justify-content:flex-end">
    ${onDelete ? '<button type="button" class="danger" id="dDel">Usuń</button><span style="flex:1"></span>' : ""}
    <button type="button" class="ghost" id="dCancel">Anuluj</button><button type="button" id="dSave">Zapisz w repozytorium</button></div>`;
  $("#dCancel").onclick = () => $("#dlg").close();
  $("#dSave").onclick = async () => {
    const btn = $("#dSave"); btn.disabled = true;
    try { await onSave(new FormData(f)); $("#dlg").close(); render() } catch (e) { if (!(e instanceof Error) || !String(e.message).match(/^\d{3}/)) status(String(e.message || e), false) } finally { btn.disabled = false }
  };
  if (onDelete) $("#dDel").onclick = async () => { if (confirm("Usunąć ten wpis?")) { try { await onDelete(); $("#dlg").close(); render() } catch (e) { } } };
  $("#dlg").showModal();
}
const allGroups = () => [...new Set(state.data.types.flatMap(t => t.bulletinGroups))].sort();
const searchBox = ph => `<div class="row" style="margin-bottom:8px"><input id="q" placeholder="${ph}" value="${esc(state.filter)}" style="flex:1"><button id="add">+ Dodaj</button></div>`;
function hookSearch(addFn) {
  $("#q").oninput = e => { state.filter = e.target.value; render(true) };
  $("#add").onclick = addFn;
}

// ---------------------------------------------------------------- bulletins
function renderBulletins() {
  const list = state.data.bulletins.bulletins.filter(b => !state.filter || (b.id + " " + b.title + " " + b.groups.join(" ")).toLowerCase().includes(state.filter.toLowerCase()));
  return `<div class="card">${searchBox("Szukaj numeru, tytułu, grupy…")}
    <p class="muted">Grupa decyduje, którzy właściciele zobaczą biuletyn. <b>ROTAX_912</b> = wszystkie samoloty z Rotaxem 912. Nowe dokumenty TOMARK dopisuje automat (cron).</p>
    <table><tr><th>Data</th><th>Numer</th><th>Tytuł</th><th class="hide-sm">Grupy</th></tr>
    ${list.map(b => `<tr class="item" data-id="${esc(b.id)}"><td>${esc(b.date)}</td><td><span class="chip">${esc(b.kind)}</span>${b.mandatory ? '<span class="chip" style="background:#0B2545">obow.</span>' : ""}<br>${esc(b.id)}</td><td>${esc(b.title)}</td><td class="hide-sm">${b.groups.map(g => `<span class="chip g">${esc(g)}</span>`).join("")}</td></tr>`).join("")}
    </table></div>`;
}
function editBulletin(b) {
  const isNew = !b; b = b || { id: "", date: new Date().toISOString().slice(0, 10), title: "", groups: [], kind: "SB", mandatory: null, url: "" };
  openDialog(`<h3>${isNew ? "Nowy biuletyn" : "Biuletyn " + esc(b.id)}</h3>
    <div class="grid2">${field("id", "Numer (unikalny)", b.id, "text", isNew ? "required" : "readonly")}${field("date", "Data", b.date, "date")}
    ${select("kind", "Rodzaj", KINDS_B.map(k => [k, k]), b.kind)}
    ${select("mandatory", "Obowiązkowy", [["null", "Sprawdź dokument"], ["true", "Tak"], ["false", "Nie / informacyjny"]], String(b.mandatory))}</div>
    <label>Tytuł<textarea name="title">${esc(b.title)}</textarea></label>
    ${field("url", "Link do źródła", b.url || "", "url")}
    <p class="muted">Grupy (komu pokazać):</p>
    <div class="row">${allGroups().map(g => `<label style="flex:0 0 auto;flex-direction:row;align-items:center"><input type="checkbox" name="g_${g}" ${b.groups.includes(g) ? "checked" : ""}> ${g}</label>`).join("")}</div>`,
    async fd => {
      const groups = allGroups().filter(g => fd.get("g_" + g));
      const id = fd.get("id").trim();
      if (!id || !fd.get("title").trim() || !groups.length) throw new Error("Uzupełnij numer, tytuł i co najmniej jedną grupę.");
      if (isNew && state.data.bulletins.bulletins.some(x => x.id === id)) throw new Error("Taki numer już istnieje.");
      const m = fd.get("mandatory");
      const nb = { id, date: fd.get("date"), title: fd.get("title").trim(), groups, kind: fd.get("kind"), mandatory: m === "null" ? null : m === "true", url: fd.get("url").trim() || null };
      const list = state.data.bulletins.bulletins;
      const i = list.findIndex(x => x.id === id);
      if (i >= 0) list[i] = nb; else list.push(nb);
      await writeFile("bulletins", (isNew ? "Add bulletin " : "Edit bulletin ") + id);
    },
    isNew ? null : async () => {
      state.data.bulletins.bulletins = state.data.bulletins.bulletins.filter(x => x.id !== b.id);
      await writeFile("bulletins", "Delete bulletin " + b.id);
    });
}

// ---------------------------------------------------------------- contacts (one tab per group)
function groupList(g) {
  const G = CGROUPS[g];
  const q = state.filter.toLowerCase();
  return (state.data[G.file]?.contacts || []).filter(c => G.kinds.includes(c.kind))
    .filter(c => !q || [c.name, c.city, c.country, c.address, c.note, (c.brands || []).join(" ")].join(" ").toLowerCase().includes(q))
    .sort((a, b) => ((a.country || "PL") !== "PL") - ((b.country || "PL") !== "PL") || (a.country || "").localeCompare(b.country || "") || (a.city || "").localeCompare(b.city || "", "pl") || a.name.localeCompare(b.name, "pl"));
}
function renderContacts(g) {
  const G = CGROUPS[g];
  const list = groupList(g);
  const auto = c => /^ulc-/.test(c.id) ? '<span class="chip g" title="Odświeżane automatycznie z listy ULC">ULC</span>' : "";
  const hint = {
    c_service: "Serwisy Rotax, dystrybutorzy i organizacje obsługowe (Part-CAO / Part-145 z listy ULC – odświeżane co tydzień).",
    c_exam: "Listy ULC (samoloty, UL, mechanicy) – odświeżane co tydzień. Aplikacja pobiera je tylko na żądanie użytkownika. Ręcznie dodani egzaminatorzy zostają.",
    c_mech: "Mechanicy dodani ręcznie. Dane osób prywatnych publikuj tylko za ich zgodą.",
    c_instr: "Instruktorzy dodani ręcznie. Dane osób prywatnych publikuj tylko za ich zgodą.",
  }[g] || "Współrzędne służą do sortowania „najbliżsi” w aplikacji.";
  return `<div class="card">${searchBox("Szukaj nazwy, miasta, marki, uprawnień…")}
    <p class="muted">${hint} Pokazano: <b>${list.length}</b>.</p>
    <table class="contacts"><tr><th>Nazwa</th>${G.kinds.length > 1 ? "<th>Rodzaj</th>" : ""}<th>Miejscowość</th><th class="hide-sm">Telefon</th><th class="hide-sm">E-mail</th></tr>
    ${list.map(c => `<tr class="item" data-id="${esc(c.id)}">
      <td><b>${esc(c.name)}</b> ${auto(c)}<div class="muted ell">${esc((c.brands || []).join(", "))}</div></td>
      ${G.kinds.length > 1 ? `<td><span class="chip">${esc(KINDS_C[c.kind] || c.kind)}</span></td>` : ""}
      <td>${esc(c.city || "")}${c.country && c.country !== "PL" ? ` <span class="muted">${esc(c.country)}</span>` : ""}${c.lat == null ? ' <span class="muted" title="brak współrzędnych">⌖?</span>' : ""}</td>
      <td class="hide-sm nowrap">${esc(c.phone || "")}</td><td class="hide-sm">${esc(c.email || "")}</td></tr>`).join("") || `<tr><td class="muted">Brak wpisów</td></tr>`}
    </table></div>`;
}
function editContact(c, g) {
  const isNew = !c; c = c || { id: "", name: "", kind: CGROUPS[g].newKind, brands: [], country: "PL" };
  const kinds = Object.entries(KINDS_C).filter(([k]) => fileOfKind(k) === fileOfKind(c.kind));
  openDialog(`<h3>${isNew ? "Nowy wpis – " + esc(CGROUPS[g].name) : esc(c.name)}</h3>
    ${/^ulc-/.test(c.id) ? '<p class="muted">Wpis z listy ULC – przy najbliższym odświeżeniu zostanie nadpisany danymi z ULC.</p>' : ""}
    <div class="grid2">${field("name", "Nazwa / imię i nazwisko", c.name, "text", "required")}
    ${select("kind", "Rodzaj", kinds, c.kind)}
    ${field("brands", "Typy / marki / uprawnienia (po przecinku)", (c.brands || []).join(", "))}
    ${field("phone", "Telefon", c.phone)}${field("email", "E-mail", c.email, "email")}${field("web", "WWW", c.web)}
    ${field("address", "Adres / lotnisko", c.address)}${field("city", "Miejscowość", c.city)}${field("country", "Kraj (2 litery)", c.country, "text", 'maxlength="2"')}
    ${field("lat", "Szerokość (lat)", c.lat ?? "", "number", 'step="any"')}${field("lon", "Długość (lon)", c.lon ?? "", "number", 'step="any"')}
    ${field("source", "Źródło", c.source)}</div>
    <label>Uwagi<textarea name="note">${esc(c.note || "")}</textarea></label>
    <p class="muted">Współrzędne: w Mapach Google kliknij prawym przyciskiem na miejsce i skopiuj liczby.</p>`,
    async fd => {
      const name = fd.get("name").trim(); if (!name) throw new Error("Podaj nazwę.");
      const num = k => { const v = parseFloat(String(fd.get(k)).replace(",", ".")); return isNaN(v) ? undefined : v };
      const kind = fd.get("kind");
      const file = fileOfKind(kind);
      const slug = name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const id = c.id || ((file === "examiners" ? "my-exam-" : (fd.get("country") || "xx").toLowerCase() + "-") + slug).slice(0, 60) + "-" + Date.now().toString(36);
      const nc = { id, name, kind, brands: fd.get("brands").split(",").map(s => s.trim()).filter(Boolean), country: fd.get("country").toUpperCase(), city: fd.get("city"), address: fd.get("address"), lat: num("lat"), lon: num("lon"), phone: fd.get("phone"), email: fd.get("email"), web: fd.get("web"), source: fd.get("source"), note: fd.get("note") };
      Object.keys(nc).forEach(k => (nc[k] === "" || nc[k] === undefined || (Array.isArray(nc[k]) && !nc[k].length)) && delete nc[k]);
      if (!state.data[file]) state.data[file] = { version: 0, updated: "", contacts: [] };
      const list = state.data[file].contacts; const i = list.findIndex(x => x.id === id);
      if (i >= 0) list[i] = nc; else list.push(nc);
      await writeFile(file, (isNew ? "Add " : "Edit ") + kind + " " + name);
      renderTabs();
    },
    isNew ? null : async () => {
      const file = fileOfKind(c.kind);
      state.data[file].contacts = state.data[file].contacts.filter(x => x.id !== c.id);
      await writeFile(file, "Delete " + c.kind + " " + c.name);
      renderTabs();
    });
}

// ---------------------------------------------------------------- types
function renderTypes() {
  const list = state.data.types.filter(t => !state.filter || (t.name + " " + (t.manufacturer || "")).toLowerCase().includes(state.filter.toLowerCase()));
  return `<div class="card">${searchBox("Szukaj typu lub producenta…")}
    <p class="muted">Prędkości i program obsługi każdego typu. Zmiana trafia do wszystkich użytkowników – wartości bierz wyłącznie z AFM/AMM/TCDS i zaznaczaj „potwierdzone” tylko wtedy.</p>
    <table><tr><th>Typ</th><th>Kategoria</th><th class="hide-sm">Prędkości</th></tr>
    ${list.map(t => `<tr class="item" data-id="${esc(t.id)}"><td><b>${esc(t.name)}</b><br><span class="muted">${esc(t.manufacturer || "")}</span></td><td><span class="chip">${esc(t.category)}</span> ${esc(t.tcds || "")}</td><td class="hide-sm muted">${t.speeds.filter(s => s.value != null).map(s => `${s.key} ${s.value}`).join(" · ")} ${t.speeds[0]?.unit === "kmh" ? "km/h" : "kt"}</td></tr>`).join("")}
    </table></div>`;
}
function editType(t) {
  const isNew = !t;
  t = t || { id: "", name: "", family: "", manufacturer: "", category: "UL", tcds: null, bulletinGroups: ["ROTAX_912"], speeds: JSON.parse(JSON.stringify(state.data.types.at(-1).speeds)).map(s => ({ ...s, value: null, verified: false, source: "AFM – uzupełnij / fill in" })), manual: [], tasks: JSON.parse(JSON.stringify(state.data.types.find(x => x.category === "UL" && x.id !== "sd4_ul" && x.id !== "gt9")?.tasks || [])) };
  const speedRows = t.speeds.map((s, i) => `<tr><td><b>${esc(s.key)}</b></td><td><input name="sv_${i}" value="${s.value ?? ""}" type="number" step="any"></td>
    <td>${select("su_" + i, "", [["kt", "kt"], ["kmh", "km/h"]], s.unit).replace("<label>", "<label style='min-width:70px'>")}</td>
    <td><input name="ss_${i}" value="${esc(s.source)}"></td><td><input type="checkbox" name="sok_${i}" ${s.verified ? "checked" : ""}></td></tr>`).join("");
  const taskRows = t.tasks.map((k, i) => `<tr><td>${esc(k.title.pl)}<br><span class="muted">${esc(k.id)}</span></td>
    <td><input name="th_${i}" value="${k.intervalHours ?? ""}" type="number" step="any"></td><td><input name="tm_${i}" value="${k.intervalMonths ?? ""}" type="number"></td>
    <td><input name="tt_${i}" value="${k.toleranceHours ?? ""}" type="number" step="any"></td><td><input name="tsrc_${i}" value="${esc(k.source)}"></td><td><input type="checkbox" name="tok_${i}" ${k.verified ? "checked" : ""}></td></tr>`).join("");
  openDialog(`<h3>${isNew ? "Nowy typ" : esc(t.name)}</h3>
    <div class="grid2">${field("id", "Id (bez spacji)", t.id, "text", isNew ? "required" : "readonly")}${field("name", "Nazwa", t.name)}${field("manufacturer", "Producent", t.manufacturer)}
    ${select("category", "Kategoria", [["EASA", "EASA"], ["UL", "UL / LSA"]], t.category)}${field("tcds", "TCDS", t.tcds || "")}${field("groups", "Grupy biuletynów (po przecinku)", t.bulletinGroups.join(", "))}</div>
    <h4>Prędkości (IAS)</h4><table class="small"><tr><th>Klucz</th><th>Wartość</th><th>Jedn.</th><th>Źródło</th><th>Potw.</th></tr>${speedRows}</table>
    <h4>Program obsługi</h4><table class="small"><tr><th>Praca</th><th>Co h</th><th>Co mies.</th><th>Tol. h</th><th>Źródło</th><th>Potw.</th></tr>${taskRows}</table>
    <details><summary class="muted">Zaawansowane: pełny JSON typu (sekcje instrukcji, tłumaczenia)</summary><textarea name="raw" style="min-height:220px;font-family:monospace;font-size:12px">${esc(JSON.stringify(t, null, 1))}</textarea></details>`,
    async fd => {
      let nt;
      const rawChanged = fd.get("raw") !== JSON.stringify(t, null, 1);
      if (rawChanged) { nt = JSON.parse(fd.get("raw")) } else {
        nt = JSON.parse(JSON.stringify(t));
        nt.id = fd.get("id").trim(); nt.name = fd.get("name").trim(); nt.manufacturer = fd.get("manufacturer").trim(); nt.family = nt.family || nt.manufacturer.toLowerCase().split(" ")[0];
        nt.category = fd.get("category"); nt.tcds = fd.get("tcds").trim() || null;
        nt.bulletinGroups = fd.get("groups").split(",").map(s => s.trim()).filter(Boolean);
        const n = v => v === "" || v == null ? null : Number(v);
        nt.speeds.forEach((s, i) => { s.value = n(fd.get("sv_" + i)); s.unit = fd.get("su_" + i); s.source = fd.get("ss_" + i); s.verified = !!fd.get("sok_" + i) && s.value != null });
        nt.tasks.forEach((k, i) => { k.intervalHours = n(fd.get("th_" + i)); const m = n(fd.get("tm_" + i)); k.intervalMonths = m == null ? null : Math.round(m); k.toleranceHours = n(fd.get("tt_" + i)); k.source = fd.get("tsrc_" + i); k.verified = !!fd.get("tok_" + i) });
      }
      if (!nt.id || !/^[a-z0-9_]+$/.test(nt.id)) throw new Error("Id: małe litery, cyfry i _.");
      if (!["EASA", "UL"].includes(nt.category)) throw new Error("Kategoria musi być EASA albo UL.");
      if (isNew && state.data.types.some(x => x.id === nt.id)) throw new Error("Taki id już istnieje.");
      const i = state.data.types.findIndex(x => x.id === nt.id);
      if (i >= 0) state.data.types[i] = nt; else state.data.types.push(nt);
      await writeFile("types", (isNew ? "Add type " : "Edit type ") + nt.name);
    },
    isNew ? null : async () => {
      if (["sd4_rtc", "sd4_nvfr", "sd4_ul", "gt9"].includes(t.id) && !confirm("To typ TOMARK – na pewno usunąć?")) throw new Error("cancel");
      state.data.types = state.data.types.filter(x => x.id !== t.id);
      await writeFile("types", "Delete type " + t.name);
    });
}


// ---------------------------------------------------------------- news (announcements shown on the app's home card)
function renderNews() {
  const list = state.data.news.messages.filter(n => !state.filter || (n.title + " " + n.text).toLowerCase().includes(state.filter.toLowerCase()));
  return `<div class="card">${searchBox("Szukaj komunikatu…")}
    <p class="muted">Komunikaty pojawiają się na karcie głównej aplikacji (maks. 3 najnowsze). Użytkownik może zamknąć komunikat u siebie.</p>
    <table><tr><th>Data</th><th>Tytuł</th><th class="hide-sm">Treść</th></tr>
    ${list.map(n => `<tr class="item" data-id="${esc(n.id)}"><td>${esc(n.date)}</td><td><b>${esc(n.title)}</b></td><td class="hide-sm muted">${esc(n.text)}</td></tr>`).join("")}</table></div>`;
}
function editNews(n) {
  const isNew = !n; n = n || { id: "n" + Date.now().toString(36), date: new Date().toISOString().slice(0, 10), title: "", text: "", url: "" };
  openDialog(`<h3>${isNew ? "Nowy komunikat" : "Komunikat"}</h3>
    <div class="grid2">${field("date", "Data", n.date, "date")}${field("title", "Tytuł", n.title, "text", "required")}</div>
    <label>Treść<textarea name="text">${esc(n.text)}</textarea></label>${field("url", "Link (opcjonalnie)", n.url || "", "url")}`,
    async fd => {
      if (!fd.get("title").trim()) throw new Error("Podaj tytuł.");
      const nn = { id: n.id, date: fd.get("date"), title: fd.get("title").trim(), text: fd.get("text").trim(), url: fd.get("url").trim() || null };
      const list = state.data.news.messages; const i = list.findIndex(x => x.id === n.id);
      if (i >= 0) list[i] = nn; else list.unshift(nn);
      list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      await writeFile("news", (isNew ? "Add news " : "Edit news ") + nn.title);
    },
    isNew ? null : async () => { state.data.news.messages = state.data.news.messages.filter(x => x.id !== n.id); await writeFile("news", "Delete news " + n.title) });
}

// ---------------------------------------------------------------- history: backups + audit log
async function renderHistory() {
  const v = $("#view");
  v.innerHTML = `<div class="card"><p class="muted">Wczytywanie…</p></div>`;
  const [b, l] = await Promise.all([api("backups"), api("log")]);
  v.innerHTML = `<div class="card"><h3 style="margin-top:0">Kopie zapasowe</h3>
    <p class="muted">Przed każdym zapisem system zachowuje poprzednią wersję pliku (ostatnie 40 na plik). Przywrócenie też tworzy kopię bieżącej wersji.</p>
    <table>${b.backups.map(x => `<tr><td>${esc(x.name)}</td><td class="muted">${Math.round(x.size / 1024)} kB</td><td>${state.user.role === "admin" ? `<button class="ghost" data-r="${esc(x.name)}">Przywróć</button>` : ""}</td></tr>`).join("") || "<tr><td class='muted'>Brak kopii</td></tr>"}</table></div>
    <div class="card"><h3 style="margin-top:0">Dziennik zmian</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(l.log.join("\n"))}</pre></div>
    <div class="card"><h3 style="margin-top:0">Adres danych dla aplikacji</h3><p><code>${esc(state.publicBase || "")}</code></p>
    <p class="muted">Wpisz go jako <code>dataBaseUrl</code> w pliku <code>data/config.json</code> repozytorium GitHub – wtedy wszystkie aplikacje przełączą się na ten serwer.</p></div>`;
  v.querySelectorAll("button[data-r]").forEach(btn => btn.onclick = async () => {
    if (!confirm("Przywrócić " + btn.dataset.r + "?")) return;
    try { await api("restore", { body: { name: btn.dataset.r } }); await Promise.all(Object.keys(FILES).map(readFile)); status("Przywrócono " + btn.dataset.r); renderHistory() } catch (e) { status(e.message, false) }
  });
}

// ---------------------------------------------------------------- users
async function renderUsers() {
  const v = $("#view");
  const j = await api("users");
  v.innerHTML = `<div class="card"><h3 style="margin-top:0">Użytkownicy panelu</h3>
    <p class="muted"><b>admin</b> – wszystko, <b>editor</b> – edycja danych, <b>viewer</b> – tylko podgląd.</p>
    <table>${j.users.map(u => `<tr><td><b>${esc(u.login)}</b></td><td><span class="chip">${esc(u.role)}</span></td><td><button class="ghost" data-u="${esc(u.login)}" data-role="${esc(u.role)}">Edytuj</button></td></tr>`).join("")}</table>
    <div class="row" style="margin-top:10px"><button id="addUser">+ Dodaj użytkownika</button></div></div>`;
  const edit = (login, role) => openDialog(`<h3>${login ? esc(login) : "Nowy użytkownik"}</h3>
    <div class="grid2">${field("login", "Login", login || "", "text", login ? "readonly" : "required")}
    ${select("role", "Rola", [["editor", "editor"], ["admin", "admin"], ["viewer", "viewer"]], role || "editor")}
    ${field("password", login ? "Nowe hasło (puste = bez zmiany)" : "Hasło (min. 10 znaków)", "", "password", 'autocomplete="new-password"')}</div>`,
    async fd => { await api("users", { body: { login: fd.get("login"), role: fd.get("role"), password: fd.get("password") } }); status("Zapisano użytkownika") },
    login ? async () => { await api("users", { body: { login, role, delete: true } }); status("Usunięto użytkownika") } : null);
  v.querySelectorAll("button[data-u]").forEach(b => b.onclick = () => edit(b.dataset.u, b.dataset.role));
  $("#addUser").onclick = () => edit(null, null);
}

// ---------------------------------------------------------------- render
function render(keepFocus) {
  if (!state.data.types) return;
  const v = $("#view");
  const sel = keepFocus ? $("#q")?.selectionStart : null;
  if (state.tab === "bulletins") { v.innerHTML = renderBulletins(); hookSearch(() => editBulletin(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editBulletin(state.data.bulletins.bulletins.find(b => b.id === r.dataset.id))) }
  if (CGROUPS[state.tab]) {
    const g = state.tab, file = CGROUPS[g].file;
    v.innerHTML = renderContacts(g); hookSearch(() => editContact(null, g));
    v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editContact(state.data[file].contacts.find(c => c.id === r.dataset.id), g));
  }
  if (state.tab === "news") { v.innerHTML = renderNews(); hookSearch(() => editNews(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editNews(state.data.news.messages.find(n => n.id === r.dataset.id))) }
  if (state.tab === "history") { renderHistory().catch(e => status(e.message, false)); return }
  if (state.tab === "users") { renderUsers().catch(e => status(e.message, false)); return }
  if (state.tab === "types") { v.innerHTML = renderTypes(); hookSearch(() => editType(null)); v.querySelectorAll("tr.item").forEach(r => r.onclick = () => editType(state.data.types.find(t => t.id === r.dataset.id))) }
  if (keepFocus) { const q = $("#q"); q.focus(); q.setSelectionRange(sel, sel) }
}

start().catch(e => status("Serwer: " + e.message, false));
</script>
</body>
</html>
