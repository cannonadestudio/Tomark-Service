name: Update bulletins

on:
  schedule:
    - cron: '17 5 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check TOMARK technical support list
        run: python3 tools/fetch_tomark.py
      - name: Validate
        run: python3 tools/validate_data.py
      - name: Commit new bulletins
        run: |
          if git diff --quiet -- data tools; then
            echo "No new bulletins"; exit 0
          fi
          git config user.name "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add data tools
          git commit -m "Auto: new bulletins from TOMARK technical support"
          git push
