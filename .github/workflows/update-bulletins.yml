name: Update bulletins

on:
  schedule:
    - cron: '17 5 * * *'   # daily
  workflow_dispatch:
  push:                     # dry run whenever the collector or its sources change
    branches: [ main ]
    paths: [ 'tools/fetch_bulletins.py', 'tools/bulletin_sources.json', 'tools/fetch_tomark.py' ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]') && '1' || '0' }}
      AH_SERVER: ${{ secrets.AH_SERVER }}
      AH_CRON_KEY: ${{ secrets.AH_CRON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: TOMARK technical support list
        if: env.DRY_RUN != '1'
        run: python3 tools/fetch_tomark.py || echo "::warning::TOMARK check failed"
      - name: EASA ADs and manufacturers' bulletin pages
        run: python3 tools/fetch_bulletins.py
      - name: Validate
        run: python3 tools/validate_data.py
      - name: Commit new bulletins
        if: env.DRY_RUN != '1'
        run: |
          if git diff --quiet -- data tools; then
            echo "No new bulletins"; exit 0
          fi
          git pull --rebase --quiet || true
          git config user.name "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add data tools
          git commit -m "Auto: new bulletins"
          git push
      - name: Send new bulletins to own server (if configured)
        if: env.DRY_RUN != '1' && env.AH_SERVER != ''
        run: python3 tools/push_to_server.py
