name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate data files
        run: python3 tools/validate_data.py

      - name: Bundle current data into the app
        run: cp data/bulletins.json data/contacts.json data/types.json app/src/main/assets/

      - name: Release key (if the secret is set)
        env:
          KS: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/aerohangar.jks"
            echo "AH_KEYSTORE_FILE=$RUNNER_TEMP/aerohangar.jks" >> "$GITHUB_ENV"
            echo "Signing with own key"
          else
            echo "::warning::No AH_KEYSTORE_BASE64 secret – release APK signed with the test key"
          fi

      - name: Build
        env:
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease 2>&1 | tee build.log || {
            # Surface compiler / resource / test errors as annotations (readable without opening the log).
            grep -E "^e: |error:|ERROR:|FAILED|AAPT|Exception|expected:<" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TomarkPilot-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
