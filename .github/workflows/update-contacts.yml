name: Update contacts

on:
  schedule:
    - cron: '43 4 * * 1'   # weekly, Monday
  workflow_dispatch:
  push:                     # dry run when the collector changes; "[collect]" in the commit message = real run
    branches: [ main ]
    paths: [ 'tools/fetch_contacts.py' ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]') && '1' || '0' }}
      AH_SERVER: ${{ secrets.AH_SERVER }}
      AH_CRON_KEY: ${{ secrets.AH_CRON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pdfplumber
      - name: ULC examiners and maintenance organisations
        run: python3 tools/fetch_contacts.py
      - name: Validate
        run: python3 tools/validate_data.py
      - name: Commit
        if: env.DRY_RUN != '1'
        run: |
          if git diff --quiet -- data tools; then echo "No changes"; exit 0; fi
          git config user.name "contacts-bot"
          git config user.email "contacts-bot@users.noreply.github.com"
          git add data tools
          git commit -m "Auto: ULC examiners and maintenance organisations"
          git pull --rebase --quiet
          git push
      - name: Send official lists to own server (if configured)
        if: env.DRY_RUN != '1' && env.AH_SERVER != ''
        run: python3 tools/push_contacts_to_server.py
